name: Verify resume

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/resume/requirements.txt

      - name: Install resume dependencies
        run: python -m pip install -r tools/resume/requirements.txt

      - name: Verify generated PDF is current
        run: python tools/resume/build.py --check
